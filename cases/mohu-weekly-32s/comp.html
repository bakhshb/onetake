<script>
'use strict';
const {clamp, lerp, seg, sstep, ssstep, spring, ease} = OM;
const W = 1080, H = 1920, DUR = 34;
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);

// ───────────────────────── data (from the report, 5 Nov 2026) ─────────────────────────
const C = { navy:'#174766', green:'#038060', brown:'#87452b', grey:'#a6a6a6', gold:'#d9a86a',

const SEC = [

    pct:true, rows:[[5,[51,15,65,25]],[1,[15,15,34,0]],[2,null,'ستُدمج في نسك ولن تُقيَّم بشكل مستقل'],[8,[0,0,57,0]],[6,[65,15,43,75]]],
    ft:['أبرز المستجدات','• ارتفاع إنجاز تجربة المستخدم إلى 54% مع قرب اكتمال أحد المتطلبات','• ارتفاع التعامل مع الشكاوى إلى 52% بعد تحديث خطة خدمات المستفيدين'] },
];
const NAMES = ['مكتب معالي الوزير','وكالة شؤون الحج','وكالة شؤون العمرة والزيارة','وكالة التوعية وتنمية المهارات',
  'وكالة التعاون الدولي والشراكات','وكالة التحول الرقمي وتقنية المعلومات','مركز منصة نسك الرقمية','برنامج خدمة ضيوف الرحمن',
  'وكالة تطوير الأعمال وخدمة المستفيدين','مركز امتثال الأعمال','وكالة الخدمات المشتركة','مركز التخطيط الاستراتيجي'];

// ───────────────────────── timeline ─────────────────────────
const T = {
  seed: 0.45, drawA: [0.7, 1.9], drawB: [1.05, 2.25], inner: [1.9, 2.6], land: 2.3,
  words: 2.7, date: 3.25, rule: 3.4, org: 3.6,
  lift: 5.6, hop: [5.7, 6.65], iris: [5.85, 6.85], tabs: 6.35, hero: 6.5, bars: 6.7, foot: 6.9,
  count0: [6.7, 7.65], cells0: 7.0, grow0: 7.9, ft0: 8.7,
  S: [null, 11.6, 16.4, 22.8],           // section changes
  out: 28.8, irisOut: [29.15, 30.1], home: [29.0, 30.05], thanks: 30.35, org2: 30.7, sub2: 30.85,
};
// active-section blend: a(t) in [0..3] is continuous — index i plus progress toward i+1 for each element's own window
const secAt = t => (t < T.S[1] ? 0 : t < T.S[2] ? 1 : t < T.S[3] ? 2 : 3);

// ───────────────────────── layout (world px) ─────────────────────────
const TAB = { y: 78, h: 96, x0: 48, x1: 1032, gap: 14 };
TAB.w = (TAB.x1 - TAB.x0 - 3 * TAB.gap) / 4;
const tabX = i => TAB.x1 - (i + 1) * TAB.w - i * TAB.gap;
const HERO = { x: 48, y: 236, w: 984, h: 470 };
const STAR_H = { x: 818, y: 450 }, STAR_I = { x: 540, y: 820 }, R0 = 126;
const CELL = [[500, 360], [218, 360], [500, 565], [218, 565]];
const BARS = { x: 48, y: 740, w: 984, h: 832 };
const ROW0 = 880, PITCH = 82, AX = 606, MAXW = 498, LBLR = 1004, LBLW = 380;
const FOOT = { x: 48, y: 1606, w: 984, h: 236 };
const RING = { r0: 132, dr: 22, w: 13 };

// ───────────────────────── DOM ─────────────────────────
const world = $('world');
function mk(parent, cls, css = {}, html = '') { const e = document.createElement('div'); e.className = cls; Object.assign(e.style, css); e.innerHTML = html; parent.appendChild(e); return e; }
const px = v => v + 'px';
const tabs = SEC.map((s, i) => mk(world, 'a tab', { left: px(tabX(i)), top: px(TAB.y), width: px(TAB.w) }, s.tab));
const pill = mk(world, 'a', { height: px(TAB.h), top: px(TAB.y) }); pill.id = 'pill';
const ptxt = SEC.map((s, i) => mk(world, 'a ptxt', { top: px(TAB.y), width: px(TAB.w + 40) }, s.tab));
const hero = mk(world, 'a card', { left: px(HERO.x), top: px(HERO.y), width: px(HERO.w), height: px(HERO.h) });
const vline = mk(world, 'a', { left: px(358), top: px(300), width: '2px', height: px(340), background: 'var(--line)' });
const hline = mk(world, 'a', { left: px(90), top: px(462), width: px(530), height: '2px', background: 'var(--line)' });
const chev = mk(world, 'a', { left: px(640), top: px(418), width: '40px', height: '64px' },
  '<svg width="40" height="64" viewBox="0 0 40 64"><path d="M34 4 L8 32 L34 60 L24 32 Z" fill="#d9a86a"/></svg>');
const starLbl = SEC.map(s => mk(world, 'a lbl gold', { fontWeight: 700, fontSize: '30px' }, s.totalLbl));
const cellN = [0, 1, 2, 3].map(() => mk(world, 'a num', { fontSize: '80px' }));
const cellL = SEC.map(s => s.cells.map(c => c ? mk(world, 'a lbl', { color: c[2] }, c[1]) : null));
const bars = mk(world, 'a card', { left: px(BARS.x), top: px(BARS.y), width: px(BARS.w), height: px(BARS.h) });
const head = SEC.map(s => mk(world, 'a hd', { color: s.color === '#c99a5c' ? '#a87a3e' : s.color }, s.head));
const legend = SEC.map(s => mk(world, 'a leg', {}, s.legend.map(([n, c]) => `<span><i style="background:${c}"></i>${n}</span>`).join('')));
const axis = mk(world, 'a', { left: px(AX), width: '2px', background: '#2b2b2b' });
const rows = NAMES.map(n => {
  const lbl = mk(world, 'a rowlbl', {}, n);
  const segs = [0, 1, 2, 3].map(() => mk(world, 'a seg'));
  const nums = [0, 1, 2, 3].map(() => mk(world, 'a segn'));
  const note = mk(world, 'a', { height: '46px', background: '#ece9e5', borderRadius: '6px', fontSize: '21px', color: '#777', lineHeight: '46px', textAlign: 'center', whiteSpace: 'nowrap' });
  return { lbl, segs, nums, note };
});
const foot = mk(world, 'a card', { left: px(FOOT.x), top: px(FOOT.y), width: px(FOOT.w), height: px(FOOT.h) });
const footBar = mk(world, 'a', { left: px(FOOT.x + FOOT.w - 10), top: px(FOOT.y + 34), width: '8px', height: px(FOOT.h - 68), borderRadius: '4px' });
const ft = SEC.map(s => mk(world, 'a ft', {}, `<b style="color:${s.color === '#c99a5c' ? '#a87a3e' : s.color}">${s.ft[0]}</b><p>${s.ft[1]}</p><p>${s.ft[2]}</p>`));

// star geometry
function octagram(R) { // outline of two overlapping squares
  const r = R * Math.cos(Math.PI / 4) / Math.cos(Math.PI / 8); let d = '';
  for (let k = 0; k < 16; k++) { const a = -Math.PI / 2 + k * Math.PI / 8, rr = k % 2 ? r : R; d += (k ? 'L' : 'M') + (rr * Math.cos(a)).toFixed(2) + ' ' + (rr * Math.sin(a)).toFixed(2); }
  return d + 'Z';
}
function square(R, rot) { let d = ''; for (let k = 0; k < 4; k++) { const a = rot - Math.PI / 2 + k * Math.PI / 2; d += (k ? 'L' : 'M') + (R * Math.cos(a)).toFixed(2) + ' ' + (R * Math.sin(a)).toFixed(2); } return d + 'Z'; }
$('sFill').setAttribute('d', octagram(R0)); $('sFillW').setAttribute('d', octagram(R0));
$('sqA').setAttribute('d', square(R0, 0)); $('sqB').setAttribute('d', square(R0, Math.PI / 4));
$('sIn').setAttribute('r', (R0 * 0.62).toFixed(1));
const NS = 'http://www.w3.org/2000/svg';
const ringEls = SEC[3].cells.map((c, i) => {
  const r = RING.r0 + i * RING.dr;
  const tr = document.createElementNS(NS, 'circle'); tr.setAttribute('r', r); tr.setAttribute('fill', 'none'); tr.setAttribute('stroke', '#ece7e0'); tr.setAttribute('stroke-width', RING.w);
  const ar = document.createElementNS(NS, 'circle'); ar.setAttribute('r', r); ar.setAttribute('fill', 'none'); ar.setAttribute('stroke', c[2]); ar.setAttribute('stroke-width', RING.w);
  ar.setAttribute('stroke-linecap', 'round'); ar.setAttribute('pathLength', '100'); ar.setAttribute('transform', 'rotate(-90)');
  $('rings').appendChild(tr); $('rings').appendChild(ar); return { tr, ar, r, v: c[0] };
});

// ───────────────────────── motion helpers ─────────────────────────
const sp = (t, t0, z = 0.72, w = 15) => spring(t - t0, z, w);                 // landing spring 0→1
function swap(t, tin, tout, d = 22) {                                          // a label that rises in and lifts out
  const a = tin == null ? 1 : sp(t, tin, 0.8, 18), b = tout == null ? 0 : ssstep(tout, tout + 0.32, t);
  return { op: clamp(a * 1.4) * (1 - b), y: (1 - a) * d - b * d };
}
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})`; };
const secWin = i => [T.S[i] ?? 0, T.S[i + 1] ?? T.out];                       // when section i owns the screen
// progress of the change into section i for an element whose own move runs at offset o, length d
const chg = (t, i, o, d, curve = ease.expoOut) => (i === 0 ? 1 : curve(seg(t, T.S[i] + o, T.S[i] + o + d)));

// ───────────────────────── camera ─────────────────────────
let KEYS, HITS;
function setupCamera() {
  const F = { x: 540, y: 960, zoom: 1 };
  KEYS = [
    { t: 0, x: 540, y: 820, zoom: 1.8 }, { t: 0.45, x: 540, y: 820, zoom: 1.8 },
    { t: 2.9, x: 540, y: 900, zoom: 1.0, curve: ease.cubicInOut }, { t: 5.6, x: 540, y: 900, zoom: 1.0 },
    { t: 6.7, x: 690, y: 600, zoom: 1.2, curve: ease.sineInOut }, { t: 7.75, x: 690, y: 600, zoom: 1.2 },
    { t: 8.8, ...F, curve: ease.cubicInOut },
    { t: 11.6, ...F }, { t: 12.05, x: 700, y: 560, zoom: 1.27, curve: ease.expoInOut }, { t: 12.95, x: 700, y: 560, zoom: 1.27 }, { t: 13.75, ...F, curve: ease.cubicInOut },
    { t: 16.4, ...F }, { t: 16.9, x: 690, y: 540, zoom: 1.34, rot: -0.012, curve: ease.expoInOut }, { t: 18.0, x: 690, y: 540, zoom: 1.34, rot: -0.012 }, { t: 18.85, ...F, curve: ease.cubicInOut },
    { t: 22.8, ...F }, { t: 23.35, x: 760, y: 520, zoom: 1.45, curve: ease.expoInOut }, { t: 24.75, x: 760, y: 520, zoom: 1.45 }, { t: 25.6, ...F, curve: ease.cubicInOut },
    { t: 28.8, ...F }, { t: 30.1, x: 540, y: 900, zoom: 1.0, curve: ease.cubicInOut },
  ];
  HITS = [[T.land, 7, 9], [T.count0[1] - 0.05, 6, 10], [T.S[1] + 1.0, 6, 10], [T.S[2] + 1.15, 11, 8], [T.S[3] + 2.3, 6, 10], [T.irisOut[1], 7, 9]];
}
function camAt(t) {
  const c = OM.camera(t, KEYS, { W, H });
  let { x, y, rot } = c;
  for (const [th, amp, decay] of HITS) { const s = OM.shake(t, th, { amp, decay, seed: Math.round(th * 100) }); x += s.x / c.zoom; y += s.y / c.zoom; rot += s.rot; }
  // quantise so a settled camera repeats its frame exactly (holds stay byte-identical)
  const q = v => Math.round(v * 16) / 16;
  return { x: q(x), y: q(y), zoom: Math.round(c.zoom * 2000) / 2000, rot: Math.round(rot * 1e5) / 1e5 };
}

// ───────────────────────── the state at t (pure) ─────────────────────────
function state(t) {
  const s = {};
  s.cam = camAt(t);
  s.V = OM.view(s.cam, { W, H });
  // star position / scale / spin
  let sx = STAR_I.x, sy = STAR_I.y, sc = 1.34, rot = 0;
  const kh = ease.expoInOut(seg(t, ...T.hop));
  const arc = Math.sin(Math.PI * kh) * -60;
  sx = lerp(STAR_I.x, STAR_H.x, kh); sy = lerp(STAR_I.y, STAR_H.y, kh) + arc; sc = lerp(1.34, 1, kh); rot = kh * 45;
  for (let i = 1; i < 4; i++) rot += 45 * sp(t, T.S[i] + 0.2, 0.62, 13);       // one point per section
  const kd = sp(t, T.S[3] + 0.2, 0.8, 12); sc *= lerp(1, 0.78, kd);               // digital: the star yields to its rings
  const kback = ease.expoInOut(seg(t, ...T.home));
  sx = lerp(sx, STAR_I.x, kback); sy = lerp(sy, STAR_I.y, kback) - Math.sin(Math.PI * kback) * 50; sc = lerp(sc, 1.34, kback); rot += kback * 45;
  // landing squash on the intro land

  $('sFill').style.opacity = D.fill.toFixed(3); $('sFillW').style.opacity = D.white.toFixed(3);
  // the rosette: four rings around the star, one per maturity dimension
  ringEls.forEach((R, i) => {
    const k = ease.cubicOut(seg(t, T.S[3] + 0.85 + 0.16 * i, T.S[3] + 2.0 + 0.16 * i)) * (1 - ease.expoIn(seg(t, T.out, T.out + 0.5)));
    const tk = sstep(T.S[3] + 0.5 + 0.1 * i, T.S[3] + 0.9 + 0.1 * i, t) * (1 - sstep(T.out + 0.2, T.out + 0.6, t));
    R.ar.setAttribute('stroke-dasharray', `${(R.v * k).toFixed(3)} 200`); R.ar.style.opacity = k > 0.002 ? 1 : 0;
    R.tr.style.opacity = tk.toFixed(3);
  });
  $('rings').setAttribute('transform', `translate(${st.x.toFixed(2)} ${st.y.toFixed(2)})`);
  const sn = $('snum'), txt = String(s.snum.v); if (sn.textContent !== txt) { sn.textContent = txt; sn._w = undefined; }
  sn.style.fontSize = s.snum.v >= 100 ? '84px' : '94px'; sn._w = undefined; sn._h = undefined;
  place(sn, st.x, st.y + 4, { op: s.snum.op, s: s.snum.s * (st.s / 1) });
  place($('stxt'), st.x, st.y + s.stxt.y * 0.5, { op: s.stxt.op, s: st.s / 0.78 * 0.78 });

  // tracking (screen space) for probe / motion
  const P = (x, y) => OM.project(s.V, x, y);
  const sr = R0 * st.s;
  const sb = OM.projectBox(s.V, { x: st.x - sr, y: st.y - sr, w: 2 * sr, h: 2 * sr });
  TRACK = { star: { ...sb, op: 1 }, pill: P(pxp + pw / 2, TAB.y + 48), iris: [s.iris.x, s.iris.y, s.iris.r < 2299 ? s.iris.r : 0], rows: TRACK.rows.map(([x, y]) => P(x, y)), cam: s.cam };
  return s;
}

// ───────────────────────── contract ─────────────────────────
let CUR = -1;
async function seek(t) { t = clamp(t, 0, DUR); render(t); CUR = t; return true; }
window.__seek = seek;
window.__meta = { dur: DUR, fps: 30, inFrame: { star: [0.6, DUR, 'whole'] } };

window.__motion = (t0, t1) => {
  render(t0); const A = TRACK; render((t0 + t1) / 2); const M = TRACK; render(t1); const B = TRACK;
  let d = OM.screenTravel({ ...A.cam }, { ...B.cam }, { ...M.cam }, { W, H });
  const dist = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]);
  d = Math.max(d, dist([A.star.x, A.star.y], [B.star.x, B.star.y]), Math.abs(A.star.w - B.star.w), dist(A.pill, B.pill), Math.abs(A.iris[2] - B.iris[2]) * 0.5);
  A.rows.forEach((p, i) => { if (B.rows[i]) d = Math.max(d, dist(p, B.rows[i])); });
  if (CUR >= 0) render(CUR);
  return d;
};
window.__events = () => {
  const E = [['seed', T.seed], ['drawA', T.drawA[0]], ['drawB', T.drawB[0]], ['land', T.land], ['words', T.words], ['date', T.date], ['org', T.org],
    ['lift', T.lift], ['iris', T.iris[0]], ['tabs', T.tabs], ['count', T.count0[1]]];
  for (let c = 0; c < 4; c++) E.push(['cell', T.cells0 + 0.09 * c + 0.62, c]);
  for (let r = 0; r < 8; r++) E.push(['bar', T.grow0 + 0.07 * r + 0.2, r]);
  for (let i = 1; i < 4; i++) { E.push(['pill', T.S[i], i]); E.push(['roll', T.S[i] + (i === 3 ? 0.9 : 1.15), i]); E.push(['reflow', T.S[i] + 1.4, i]); }
  for (let r = 0; r < 4; r++) E.push(['ring', T.S[3] + 0.85 + 0.16 * r, r]);
  E.push(['out', T.out], ['irisOut', T.irisOut[0]], ['close', T.irisOut[1]], ['thanks', T.thanks], ['org2', T.org2]);
  return E;
};
window.__ready = document.fonts.ready.then(() => { makeNoise(); setupCamera(); return seek(0); });

// preview: ?play  |  ?t=12.3
window.__ready.then(() => {
  if (Q.has('t')) seek(parseFloat(Q.get('t')));
  if (Q.has('play')) { const t0 = performance.now(); const loop = () => { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); }; loop(); }
});
